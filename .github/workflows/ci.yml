name: GutCPP native parity CI
on:
  push:
    branches: [main, 'wave/**']
  pull_request:
permissions:
  contents: read
jobs:
  cross-platform:
    name: ${{ matrix.os }} C++17 CMake and installed consumer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/installed
      - name: Strict build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release
      - name: Consumer configure
        run: cmake -S consumer -B consumer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/installed
      - name: Consumer build
        run: cmake --build consumer-build --config Release
      - name: Consumer execute
        run: ctest --test-dir consumer-build -C Release --output-on-failure
  sanitizers:
    name: Linux AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure
