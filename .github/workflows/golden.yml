name: GutTS pinned execution golden fixtures
on:
  push:
    branches: [main, 'wave/**']
  pull_request:
permissions:
  contents: read
jobs:
  pinned-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GutCPP
        uses: actions/checkout@v4
      - name: Checkout immutable GitTS reference
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: 3e2cbc0990ba29830ce91c5d1a1d552675d5334c
          path: .upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: .upstream/pnpm-lock.yaml
      - name: Install exact pinned source dependencies
        working-directory: .upstream
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile exact pinned source
        working-directory: .upstream
        run: pnpm run build
      - name: Generate real GutTS execution fixtures
        env:
          GUTTS_ROOT: .upstream
        run: node scripts/generate-upstream-golden.mjs
      - name: Check committed execution fixtures once present
        env:
          GUTTS_ROOT: .upstream
        shell: bash
        run: |
          if [[ -f testdata/upstream-golden/gutts-3e2cbc0.json ]]; then
            node scripts/generate-upstream-golden.mjs --check
          else
            echo 'Golden JSON has not been committed yet; the preceding step prints the actual immutable GutTS outputs for capture.'
          fi

      - name: Configure strict C++ API differential runner
        run: cmake -S . -B .differential -DBUILD_TESTING=OFF -DGUTCPP_DIFFERENTIAL_RUNNER=ON
      - name: Build native differential runner
        run: cmake --build .differential --target gutcpp_differential_runner --parallel 2
      - name: Verify executable cross-language API parity
        run: node scripts/verify-upstream-differential.mjs .upstream .differential/gutcpp_differential_runner

      - name: Build native ECMAScript JSON number runner
        run: cmake --build .differential --target gutcpp_json_number_runner --parallel 2
      - name: Compare exact pinned GutTS numeric JSON behavior
        run: node scripts/verify-json-numbers.mjs .upstream .differential/gutcpp_json_number_runner

      - name: Build actual native Ettin scoring head differential runner
        run: cmake --build .differential --target gutcpp_ettin_head_runner --parallel 2
      - name: Verify Ettin float32 head scoring against pinned GutTS
        run: node scripts/verify-ettin-head.mjs .upstream .differential/gutcpp_ettin_head_runner

      - name: Build native MiniLM post-embedding mathematics runner
        run: cmake --build .differential --target gutcpp_minilm_math_runner --parallel 2
      - name: Verify real pinned GutTS MiniLM cosine calculation
        run: node scripts/verify-minilm-cosine.mjs .upstream .differential/gutcpp_minilm_math_runner

      - name: Configure pinned Ada WHATWG URL adapter
        run: cmake -S . -B .ada-verify -DBUILD_TESTING=OFF -DGUTCPP_TEST_ADA_URL=ON
      - name: Build Ada-backed native URL differential runner
        run: cmake --build .ada-verify --target gutcpp_ada_url_runner gutcpp_ada_url_test --parallel 2
      - name: Run Ada URL native assertions
        run: .ada-verify/gutcpp_ada_url_test
      - name: Compare real compiled GutTS URL operations against Ada C++17
        run: node scripts/verify-ada-url.mjs .upstream .ada-verify/gutcpp_ada_url_runner
