name: GutCPP real MiniLM ONNX inference
on:
  pull_request:
  push:
    branches: [main, 'wave/**']
permissions:
  contents: read
jobs:
  real-minilm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout GutCPP
        uses: actions/checkout@v4
      - name: Acquire official ONNX Runtime 1.21.0 NuGet native C ABI
        shell: bash
        run: |
          curl --retry 3 -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.21.0/microsoft.ml.onnxruntime.1.21.0.nupkg" -o ort.nupkg
          curl --retry 3 -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.21.0/microsoft.ml.onnxruntime.1.21.0.nupkg.sha512" -o ort.sha512
          python3 - <<'PYORT'
          import base64, hashlib, os, pathlib, shutil, zipfile
          blob=pathlib.Path('ort.nupkg').read_bytes()
          expected=base64.b64decode(pathlib.Path('ort.sha512').read_text().strip())
          if hashlib.sha512(blob).digest()!=expected: raise RuntimeError('Official NuGet ONNX Runtime hash mismatch')
          folder=pathlib.Path('.ort');(folder/'include').mkdir(parents=True,exist_ok=True);(folder/'lib').mkdir(exist_ok=True)
          with zipfile.ZipFile('ort.nupkg') as package:
            names=package.namelist()
            headers=[n for n in names if n.startswith('build/native/include/') and n.endswith('.h')]
            if not any(n.endswith('/onnxruntime_c_api.h') for n in headers): raise RuntimeError('Official NuGet ONNX C API header absent: '+repr(headers[:50]))
            for name in headers: (folder/'include'/pathlib.Path(name).name).write_bytes(package.read(name))
            platform='linux-x64' if os.environ.get('RUNNER_OS')=='Linux' else 'osx-arm64'
            runtime=[n for n in names if n.startswith(f'runtimes/{platform}/native/') and pathlib.Path(n).name.startswith('libonnxruntime') and (n.endswith('.so') or '.so.' in n or n.endswith('.dylib'))]
            if not runtime: raise RuntimeError('Native library for '+platform+' missing; available: '+repr([n for n in names if 'onnxruntime' in n and '/native/' in n][:45]))
            for name in runtime:(folder/'lib'/pathlib.Path(name).name).write_bytes(package.read(name))
          if not (folder/'lib'/'libonnxruntime.so').exists() and platform=='linux-x64':
            name=next((x.name for x in (folder/'lib').iterdir() if x.name.startswith('libonnxruntime.so.')),None)
            if name:(folder/'lib'/'libonnxruntime.so').symlink_to(name)
          if not (folder/'lib'/'libonnxruntime.dylib').exists() and platform=='osx-arm64':
            name=next((x.name for x in (folder/'lib').iterdir() if x.name.startswith('libonnxruntime.') and x.name.endswith('.dylib')),None)
            if name:(folder/'lib'/'libonnxruntime.dylib').symlink_to(name)
          print('Verified NuGet SHA512; ONNX headers and library:',list((folder/'lib').iterdir()))
          PYORT
          root="$PWD/.ort"
          echo "ONNXRUNTIME_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$root/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Build real native MiniLM C++17 with pinned MIT libembedding
        shell: bash
        run: |
          cmake -S . -B build-minilm -DBUILD_TESTING=ON -DGUTCPP_ENABLE_MINILM_ONNX=ON -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"
          cmake --build build-minilm --target gutcpp_minilm_native_test gutcpp_minilm_native_runner --parallel 2
      - name: Acquire pinned official MiniLM ONNX and tokenizer artifacts
        shell: bash
        run: |
          python3 -m venv .hf-venv
          .hf-venv/bin/python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
          .hf-venv/bin/hf download sentence-transformers/all-MiniLM-L6-v2 onnx/model.onnx tokenizer.json \
            --revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 --local-dir .model
          test -s .model/onnx/model.onnx
          test -s .model/tokenizer.json
      - name: Execute real MiniLM tokenizer, ONNX backbone and cosine inference
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$ONNXRUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$ONNXRUNTIME_ROOT/lib:${DYLD_LIBRARY_PATH:-}"
          ./build-minilm/gutcpp_minilm_native_test .model/onnx/model.onnx .model/tokenizer.json
      - name: Checkout immutable GutTS reference
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: 3e2cbc0990ba29830ce91c5d1a1d552675d5334c
          path: .upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: .upstream/pnpm-lock.yaml
      - name: Build genuine pinned GutTS reference
        working-directory: .upstream
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Compare real MiniLM inference numerical outputs
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$ONNXRUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$ONNXRUNTIME_ROOT/lib:${DYLD_LIBRARY_PATH:-}"
          node scripts/verify-minilm-native.mjs .upstream ./build-minilm/gutcpp_minilm_native_runner .model/onnx/model.onnx .model/tokenizer.json
