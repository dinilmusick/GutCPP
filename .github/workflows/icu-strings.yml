name: GutCPP optional ICU Unicode differential
on:
  push:
    branches: [main, 'wave/**']
  pull_request:
permissions:
  contents: read
jobs:
  native-icu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux ICU
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - name: Install macOS ICU
        if: runner.os == 'macOS'
        run: |
          brew install icu4c pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c):$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
      - name: Strict C++17 Unicode regression and installed consumer
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/icu_strings_test.cpp $(pkg-config --cflags --libs icu-uc icu-i18n) -o icu_strings_test
          ./icu_strings_test
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/icu_strings_runner.cpp $(pkg-config --cflags --libs icu-uc icu-i18n) -o icu_strings_runner
          cmake -S . -B build-install -DBUILD_TESTING=OFF
          cmake --install build-install --prefix "$PWD/installed"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iinstalled/include \
            tests/icu_strings_test.cpp $(pkg-config --cflags --libs icu-uc icu-i18n) -o installed_icu_consumer
          ./installed_icu_consumer
      - name: Configure strict ICU API integration and CTest
        run: cmake -S . -B build-icu -DGUTCPP_ENABLE_ICU_STRINGS=ON -DBUILD_TESTING=ON
      - name: Build actual Unicode API registry executor
        run: cmake --build build-icu --target gutcpp_icu_api_runner gutcpp_icu_api_test --parallel 2
      - name: Test actual Unicode API registry integration
        run: ctest --test-dir build-icu -R '^icu_api_test$' --output-on-failure
      - name: Verify exported opt-in target in installed CMake consumer
        shell: bash
        run: |
          cmake --install build-icu --prefix "$PWD/installed"
          cmake -S consumer/icu -B build-icu-consumer -DCMAKE_PREFIX_PATH="$PWD/installed"
          cmake --build build-icu-consumer --parallel 2
          ./build-icu-consumer/gutcpp_installed_icu_consumer
      - name: Checkout pinned GutTS
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: 3e2cbc0990ba29830ce91c5d1a1d552675d5334c
          path: .upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: .upstream/pnpm-lock.yaml
      - name: Build immutable GutTS reference
        working-directory: .upstream
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Compare compiled pinned GutTS Unicode with native ICU
        run: node scripts/verify-icu-strings.mjs .upstream ./icu_strings_runner
      - name: Compare real compiled GutTS Unicode API against registered C++ execution
        run: node scripts/verify-icu-strings.mjs .upstream ./build-icu/gutcpp_icu_api_runner
